<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="wing-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a855f7" />
      <stop offset="50%" stopColor="#7c3aed" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>
    <linearGradient id="wing-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#9333ea" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#soft-glow)">
    <!-- Aura sparkles -->
    <path d="M18 24 L20 30 L26 32 L20 34 L18 40 L16 34 L10 32 L16 30 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M102 26 L104 31 L109 33 L104 35 L102 40 L100 35 L95 33 L100 31 Z" fill="#fbbf24" opacity="0.9" />
    <circle cx="28" cy="88" r="3" fill="#c084fc" opacity="0.8" />
    <circle cx="94" cy="86" r="3" fill="#38bdf8" opacity="0.8" />

    <!-- Left Upper Wing -->
    <path d="M56 52 C42 16 12 24 16 56 C18 70 34 74 54 62 Z" fill="url(#wing-l)" stroke="#4338ca" stroke-width="2" />
    <!-- Left Wing Patterns -->
    <ellipse cx="32" cy="46" rx="9" ry="14" fill="#ede9fe" opacity="0.8" transform="rotate(-20 32 46)" />
    <circle cx="34" cy="44" r="5" fill="#f472b6" />
    <circle cx="25" cy="56" r="3" fill="#fef08a" />

    <!-- Left Lower Wing -->
    <path d="M52 62 C34 68 20 86 36 98 C50 108 58 84 56 68 Z" fill="url(#wing-l)" opacity="0.9" stroke="#4338ca" stroke-width="2" />
    <circle cx="38" cy="84" r="4.5" fill="#fbcfe8" />

    <!-- Right Upper Wing -->
    <path d="M64 52 C78 16 108 24 104 56 C102 70 86 74 66 62 Z" fill="url(#wing-r)" stroke="#4338ca" stroke-width="2" />
    <!-- Right Wing Patterns -->
    <ellipse cx="88" cy="46" rx="9" ry="14" fill="#ede9fe" opacity="0.8" transform="rotate(20 88 46)" />
    <circle cx="86" cy="44" r="5" fill="#38bdf8" />
    <circle cx="95" cy="56" r="3" fill="#fef08a" />

    <!-- Right Lower Wing -->
    <path d="M68 62 C86 68 100 86 84 98 C70 108 62 84 64 68 Z" fill="url(#wing-r)" opacity="0.9" stroke="#4338ca" stroke-width="2" />
    <circle cx="82" cy="84" r="4.5" fill="#bae6fd" />

    <!-- Antennae -->
    <path d="M56 42 Q46 20 38 24" stroke="#312e81" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="38" cy="24" r="4" fill="#a855f7" />
    <path d="M64 42 Q74 20 82 24" stroke="#312e81" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="82" cy="24" r="4" fill="#38bdf8" />

    <!-- Butterfly Body -->
    <rect x="54" y="40" width="12" height="42" rx="6" fill="#1e1b4b" />
    <ellipse cx="60" cy="42" rx="7.5" ry="8" fill="#312e81" />

    <!-- Cute Face on Body -->
    <circle cx="58" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="62" cy="40" r="1.5" fill="#ffffff" />
    <path d="M58 45 Q60 47 62 45" stroke="#fbcfe8" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>
</svg>

