    <circle cx="38" cy="68" r="4" fill="#f43f5e" opacity="0.6" />
    <circle cx="82" cy="68" r="4" fill="#f43f5e" opacity="0.6" />

    <!-- Happy Open Smile -->
    <path d="M54 70 Q60 76 66 70" stroke="#3b0764" stroke-width="2.4" stroke-linecap="round" fill="none" />

    <!-- Tiny Glasses -->
    <circle cx="46" cy="62" r="7" fill="rgba(255, 255, 255, 0.4)" stroke="#581c87" stroke-width="1.8" />
    <circle cx="74" cy="62" r="7" fill="rgba(255, 255, 255, 0.4)" stroke="#581c87" stroke-width="1.8" />
    <line x1="53" y1="62" x2="67" y2="62" stroke="#581c87" stroke-width="1.8" />
