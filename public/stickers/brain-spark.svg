    <path d="M38 52 Q48 50 44 60 Q34 62 42 72 Q50 72 46 82" stroke="#7e22ce" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M82 52 Q72 50 76 60 Q86 62 78 72 Q70 72 74 82" stroke="#7e22ce" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Spark of Genius Center -->
