    <path d="M58 42 C54 36 44 36 38 42 C30 40 22 48 24 56 C18 64 22 76 30 80 C28 88 38 96 48 94 C54 94 58 88 58 82 Z" fill="url(#brain-grad)" stroke="#6b21a8" stroke-width="2.5" />

