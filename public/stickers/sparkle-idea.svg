<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bulb-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="60%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#eab308" />
    </radialGradient>
    <linearGradient id="bulb-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>
    <filter id="bulb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ca8a04" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#bulb-shadow)">
    <!-- Light bursts -->
    <line x1="60" y1="12" x2="60" y2="4" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="22" x2="24" y2="16" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="22" x2="96" y2="16" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="50" x2="8" y2="50" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
    <line x1="104" y1="50" x2="112" y2="50" stroke="#eab308" stroke-width="3" stroke-linecap="round" />

    <!-- Cute mini butterfly wings attached to bulb -->
    <path d="M42 46 C24 30 18 52 38 60 Z" fill="url(#bulb-wing)" opacity="0.8" stroke="#7c3aed" stroke-width="1.5" />
    <path d="M78 46 C96 30 102 52 82 60 Z" fill="url(#bulb-wing)" opacity="0.8" stroke="#7c3aed" stroke-width="1.5" />

    <!-- Lightbulb Body -->
    <path d="M40 70 C34 64 30 55 30 46 C30 29.4 43.4 16 60 16 C76.6 16 90 29.4 90 46 C90 55 86 64 80 70 L76 80 L44 80 Z" fill="url(#bulb-glow)" stroke="#b45309" stroke-width="2.5" />

    <!-- Filament Spark -->
    <path d="M50 48 Q60 32 60 48 Q60 32 70 48" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cute Smiling Face -->
    <ellipse cx="50" cy="54" rx="2.8" ry="3.5" fill="#78350f" />
    <circle cx="49" cy="53" r="1" fill="#ffffff" />
    <ellipse cx="70" cy="54" rx="2.8" ry="3.5" fill="#78350f" />
    <circle cx="69" cy="53" r="1" fill="#ffffff" />
    <circle cx="44" cy="58" r="3" fill="#f43f5e" opacity="0.5" />
    <circle cx="76" cy="58" r="3" fill="#f43f5e" opacity="0.5" />
    <path d="M55 59 Q60 64 65 59" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Base Screw -->
    <rect x="46" y="82" width="28" height="6" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <rect x="48" y="90" width="24" height="6" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <path d="M52 98 C52 103 68 103 68 98 Z" fill="#64748b" stroke="#475569" stroke-width="1.5" />

    <!-- Sparkles -->
    <path d="M22 84 L24 88 L28 89 L24 91 L22 95 L20 91 L16 89 L20 88 Z" fill="#f59e0b" />
    <path d="M98 84 L100 88 L104 89 L100 91 L98 95 L96 91 L92 89 L96 88 Z" fill="#f59e0b" />
  </g>
</svg>

