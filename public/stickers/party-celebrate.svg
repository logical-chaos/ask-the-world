<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#ef4444" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <filter id="party-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#party-glow)">
    <!-- Confetti Butterflies and Streamers -->
    <path d="M50 20 Q56 12 62 18 Q68 24 74 16" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M70 32 Q80 20 86 28 Q92 36 100 24" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M30 40 Q38 30 42 36 Q46 42 54 32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Mini Fluttering Confetti Butterflies -->
    <g transform="translate(42, 16) scale(0.7)">
      <path d="M10 10 C4 2 0 12 8 16 Z" fill="#ec4899" />
      <path d="M14 10 C20 2 24 12 16 16 Z" fill="#38bdf8" />
      <circle cx="12" cy="14" r="1.5" fill="#1e1b4b" />
    </g>
    <g transform="translate(86, 18) scale(0.7) rotate(25)">
      <path d="M10 10 C4 2 0 12 8 16 Z" fill="#fbbf24" />
      <path d="M14 10 C20 2 24 12 16 16 Z" fill="#a855f7" />
      <circle cx="12" cy="14" r="1.5" fill="#1e1b4b" />
    </g>
    <g transform="translate(94, 52) scale(0.6) rotate(-20)">
      <path d="M10 10 C4 2 0 12 8 16 Z" fill="#34d399" />
      <path d="M14 10 C20 2 24 12 16 16 Z" fill="#f43f5e" />
      <circle cx="12" cy="14" r="1.5" fill="#1e1b4b" />
    </g>

    <!-- Star bursts & dots -->
    <polygon points="68,26 70,30 74,31 70,33 68,37 66,33 62,31 66,30" fill="#fbbf24" />
    <circle cx="36" cy="24" r="2.5" fill="#ec4899" />
    <circle cx="56" cy="38" r="3" fill="#fbbf24" />
    <circle cx="82" cy="48" r="2.5" fill="#a855f7" />
    <circle cx="48" cy="54" r="3.5" fill="#38bdf8" />

    <!-- Party Popper Cone -->
    <path d="M16 104 L60 60 L78 78 L34 114 Z" fill="url(#cone-grad)" stroke="#431407" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Cone Pattern Stripes -->
    <path d="M26 94 L44 76" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <path d="M30 106 L62 74" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />

    <!-- Popper Rim Burst -->
    <ellipse cx="69" cy="69" rx="14" ry="7" fill="#fef08a" stroke="#ca8a04" stroke-width="2" transform="rotate(-45 69 69)" />

    <!-- Cute Smiling Face on the Cone -->
    <circle cx="40" cy="94" r="2" fill="#ffffff" />
    <circle cx="48" cy="86" r="2" fill="#ffffff" />
    <path d="M42 94 Q46 92 48 88" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" />
  </g>
</svg>

