<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pip-stk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ede9fe" />
      <stop offset="100%" stopColor="#ddd6fe" />
    </linearGradient>
    <linearGradient id="pip-stk-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <filter id="pip-stk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7354b8" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#pip-stk-glow)">
    <!-- Decorative floating hearts -->
    <path d="M22 28 C18 20 10 24 14 32 L22 40 L30 32 C34 24 26 20 22 28 Z" fill="#f43f5e" opacity="0.85" />
    <path d="M98 22 C95 16 88 19 91 25 L98 32 L105 25 C108 19 101 16 98 22 Z" fill="#ec4899" opacity="0.85" />

    <!-- Pip's Big Butterfly Wings in Back -->
    <path d="M28 42 C12 26 8 50 28 58 C18 66 24 78 34 70 Z" fill="url(#pip-stk-wing)" stroke="#5b21b6" stroke-width="2" />
    <circle cx="22" cy="48" r="4" fill="#fbcfe8" />
    <path d="M92 42 C108 26 112 50 92 58 C102 66 96 78 86 70 Z" fill="url(#pip-stk-wing)" stroke="#5b21b6" stroke-width="2" />
    <circle cx="98" cy="48" r="4" fill="#fbcfe8" />

    <!-- Pip Antennae -->
    <path d="M50 34 Q40 16 34 22" stroke="#7354b8" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="34" cy="22" r="4.5" fill="#a78bfa" />
    <path d="M70 34 Q80 16 86 22" stroke="#7354b8" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="86" cy="22" r="4.5" fill="#a78bfa" />

    <!-- Cute Round Body & Face -->
    <circle cx="60" cy="64" r="34" fill="#fff7ed" stroke="#7354b8" stroke-width="3" />

    <!-- Blushing cheeks -->
    <circle cx="44" cy="70" r="6" fill="#fbcfe8" />
    <circle cx="76" cy="70" r="6" fill="#fbcfe8" />

    <!-- Expressive Sparkle Eyes -->
    <ellipse cx="48" cy="60" rx="4.5" ry="5.8" fill="#2e1065" />
    <circle cx="46" cy="58" r="2.2" fill="#ffffff" />
    <circle cx="50" cy="62" r="1.2" fill="#ffffff" />
    <ellipse cx="72" cy="60" rx="4.5" ry="5.8" fill="#2e1065" />
    <circle cx="70" cy="58" r="2.2" fill="#ffffff" />
    <circle cx="74" cy="62" r="1.2" fill="#ffffff" />

    <!-- Warm Beaming Smile -->
    <path d="M52 70 Q60 78 68 70" stroke="#7354b8" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Waving Little Hand -->
    <path d="M28 72 C22 66 18 68 20 74 C22 80 28 82 32 78 Z" fill="#fff7ed" stroke="#7354b8" stroke-width="2" />
    <path d="M88 64 C96 56 102 60 98 68 C96 74 90 76 86 72 Z" fill="#fff7ed" stroke="#7354b8" stroke-width="2" />

    <!-- Tiny Butterfly Hairclip -->
    <path d="M40 40 Q35 35 39 31 Q43 35 40 40 Z" fill="#c084fc" />
    <path d="M40 40 Q45 35 41 31 Q37 35 40 40 Z" fill="#a855f7" />
    <circle cx="40" cy="38" r="1.8" fill="#fef08a" />
  </g>
</svg>

