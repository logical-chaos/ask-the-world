<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#7c3aed" />
    </linearGradient>
    <linearGradient id="h-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <filter id="heart-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#heart-glow)">
    <!-- Butterfly wings radiating from heart -->
    <path d="M48 52 C22 24 10 46 26 72 C36 82 48 68 50 60 Z" fill="url(#h-wing)" opacity="0.85" stroke="#7e22ce" stroke-width="2" />
    <circle cx="28" cy="54" r="5" fill="#fdf2f8" opacity="0.9" />

    <path d="M72 52 C98 24 110 46 94 72 C84 82 72 68 70 60 Z" fill="url(#h-wing)" opacity="0.85" stroke="#7e22ce" stroke-width="2" />
    <circle cx="92" cy="54" r="5" fill="#fdf2f8" opacity="0.9" />

    <!-- Cute Heart Body -->
    <path d="M60 98 C30 76 18 52 28 34 C38 18 54 24 60 36 C66 24 82 18 92 34 C102 52 90 76 60 98 Z" fill="url(#heart-grad)" stroke="#581c87" stroke-width="2.5" />

    <!-- Heart Sheen / Highlight -->
    <path d="M34 36 C38 26 48 28 52 34 C44 34 38 40 36 46 Z" fill="#ffffff" opacity="0.5" />

    <!-- Cute Peaceful Happy Face -->
    <path d="M45 52 Q50 56 55 52" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M65 52 Q70 56 75 52" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <circle cx="42" cy="58" r="4" fill="#f43f5e" opacity="0.6" />
    <circle cx="78" cy="58" r="4" fill="#f43f5e" opacity="0.6" />
    <path d="M56 60 Q60 65 64 60" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Antennae with tiny butterflies -->
    <path d="M52 28 Q44 14 38 16" stroke="#581c87" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="38" cy="16" r="3" fill="#f472b6" />
    <path d="M68 28 Q76 14 82 16" stroke="#581c87" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="82" cy="16" r="3" fill="#f472b6" />

    <!-- Sparkles -->
    <path d="M14 26 L16 30 L20 31 L16 33 L14 37 L12 33 L8 31 L12 30 Z" fill="#fbbf24" />
    <path d="M106 24 L108 28 L112 29 L108 31 L106 35 L104 31 L100 29 L104 28 Z" fill="#fbbf24" />
    <path d="M60 106 L61 109 L64 110 L61 112 L60 115 L59 112 L56 110 L59 109 Z" fill="#fbbf24" />
  </g>
</svg>

