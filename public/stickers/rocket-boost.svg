<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rocket-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#ede9fe" />
    </linearGradient>
    <linearGradient id="rocket-fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="rocket-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#f43f5e" />
    </linearGradient>
    <filter id="rocket-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#rocket-glow)">
    <!-- Starbursts and speed trails -->
    <path d="M26 18 L28 22 L32 23 L28 25 L26 29 L24 25 L20 23 L24 22 Z" fill="#fbbf24" />
    <path d="M96 28 L98 32 L102 33 L98 35 L96 39 L94 35 L90 33 L94 32 Z" fill="#fbbf24" />
    <circle cx="20" cy="54" r="2.5" fill="#c084fc" />
    <circle cx="104" cy="68" r="3" fill="#38bdf8" />

    <!-- Exhaust Jet Flame & Butterfly Dust -->
    <path d="M48 88 C48 108 60 118 60 118 C60 118 72 108 72 88 Z" fill="url(#rocket-flame)" opacity="0.9" />
    <path d="M54 88 C54 100 60 108 60 108 C60 108 66 100 66 88 Z" fill="#fde047" />

    <!-- Rocket Fins shaped like butterfly wings -->
    <path d="M44 68 C30 70 20 86 26 96 C36 96 44 88 44 82 Z" fill="url(#rocket-fin)" stroke="#4338ca" stroke-width="2" />
    <circle cx="32" cy="88" r="3" fill="#fbcfe8" />
    <path d="M76 68 C90 70 100 86 94 96 C84 96 76 88 76 82 Z" fill="url(#rocket-fin)" stroke="#4338ca" stroke-width="2" />
    <circle cx="88" cy="88" r="3" fill="#fbcfe8" />

    <!-- Main Rocket Fuselage -->
    <path d="M60 10 C46 30 42 66 42 88 L78 88 C78 66 74 30 60 10 Z" fill="url(#rocket-hull)" stroke="#4338ca" stroke-width="2.5" />

    <!-- Nose Cone Violet Cap -->
    <path d="M60 10 C54 22 50 32 46 40 L74 40 C70 32 66 22 60 10 Z" fill="url(#rocket-fin)" stroke="#4338ca" stroke-width="2" />

    <!-- Round Porthole Window with Cute Butterfly Inside -->
    <circle cx="60" cy="56" r="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2.5" />
    <circle cx="60" cy="56" r="11" fill="#38bdf8" opacity="0.9" />
    <!-- Butterfly silhouette inside -->
    <path d="M56 54 C52 50 48 56 54 58 C50 60 52 64 56 62 Z" fill="#ffffff" />
    <path d="M64 54 C68 50 72 56 66 58 C70 60 68 64 64 62 Z" fill="#ffffff" />
    <circle cx="60" cy="57" r="1.5" fill="#1e1b4b" />
    <!-- Window Reflection -->
    <path d="M54 50 A8 8 0 0 1 66 50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Cute Smiling Decal below porthole -->
    <path d="M55 76 Q60 80 65 76" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="50" cy="74" r="2.5" fill="#f43f5e" opacity="0.6" />
    <circle cx="70" cy="74" r="2.5" fill="#f43f5e" opacity="0.6" />
  </g>
</svg>

